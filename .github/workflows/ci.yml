name: CI

on:
  push:
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-secret-key
      POSTGRES_DB: industrial_monitoring
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: industrial_monitoring
          POSTGRES_USER: django
          POSTGRES_PASSWORD: django_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U django -d industrial_monitoring"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Check database environment
        run: |
          python -c "import os; print('POSTGRES_HOST=', os.getenv('POSTGRES_HOST')); print('POSTGRES_PORT=', os.getenv('POSTGRES_PORT'))"
      
      - name: Run django checks
        run: |
          python manage.py  check
        
      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: |
          pytest -v
